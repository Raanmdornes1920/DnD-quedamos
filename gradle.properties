#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true


### PRUEBAS PARA AGILIZAR COMPILACION Y TEXTING ASIGNANDO MAS RECUERSOS A ANDOROID STUDIO###
# Permite que Gradle compile múltiples módulos en paralelo
org.gradle.parallel=true
# Ejecuta el demonio de Gradle de fondo para acelerar el inicio
org.gradle.daemon=true

